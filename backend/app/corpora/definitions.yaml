# Declares every statute the app knows about. Nothing else in the codebase
# should name a corpus id as a literal string — see registry.py.
#
# `loader` names a module in corpora/loaders/ — each source document is
# typeset completely differently (confirmed by testing, not assumed: the
# IPC loader finds zero sections in the BNS PDF and vice versa), so this is
# what lets the registry stay declarative even though the two formats need
# genuinely different parsers.
corpora:
  - id: ipc
    act: "Indian Penal Code, 1860"
    short: IPC
    jurisdiction: IN
    in_force_from: 1862-01-01
    in_force_to: 2024-06-30 # offences on/after 1 Jul 2024 are BNS
    superseded_by: bns
    source: data/ipc
    collection: jurisai_ipc
    loader: ipc_commentary
    enabled: true

  - id: bns
    act: "Bharatiya Nyaya Sanhita, 2023"
    short: BNS
    jurisdiction: IN
    in_force_from: 2024-07-01
    in_force_to: null
    supersedes: ipc
    source: data/bns
    collection: jurisai_bns
    loader: bns_bare_act
    enabled: true
