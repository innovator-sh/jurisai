{% extends "base.html" %}
{% block title %}JurisAI — Sign in{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/pages.css') }}" />
{% endblock %}
{% block content %}
<main class="auth-page">
  <div class="auth-card">
    <h1>JurisAI</h1>
    <p class="page-intro">Sign in or create an account to continue.</p>

    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" class="text-input" type="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input
        id="password"
        class="text-input"
        type="password"
        required
        autocomplete="current-password"
        minlength="8"
      />

      <div class="auth-actions">
        <button type="submit" id="login-btn" class="btn btn-primary">Log in</button>
        <button type="button" id="signup-btn" class="btn btn-secondary">Sign up</button>
      </div>
    </form>

    <p id="status" class="form-status" role="status"></p>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', path='js/login.js') }}"></script>
{% endblock %}
