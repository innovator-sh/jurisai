{% extends "base.html" %}
{% block title %}JurisAI — Sign in{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/pages.css') }}" />
{% endblock %}
{% block content %}
<main class="auth-page">
  <div class="auth-card">
    <h1>JurisAI</h1>
    <p class="page-intro">Sign in or create an account to continue.</p>

    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" class="text-input" type="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input
        id="password"
        class="text-input"
        type="password"
        required
        autocomplete="current-password"
        minlength="8"
      />

      <label for="role">I am a <span class="field-note">(needed to sign up)</span></label>
      <select id="role" class="text-input">
        <option value="">Select…</option>
        <option value="citizen">Citizen / member of the public</option>
        <option value="lawyer">Lawyer / legal professional</option>
        <option value="police">Police / law enforcement</option>
      </select>

      <div class="consent-row">
        <input type="checkbox" id="consent" />
        <label for="consent">
          I am 18 or older and I have read the
          <a href="/privacy" target="_blank" rel="noopener">Privacy Notice</a>
          (<a href="/privacy#hindi" target="_blank" rel="noopener" lang="hi">हिन्दी</a>)
          and consent to JurisAI processing my account and chat data as described.
          <span class="field-note">(needed to sign up)</span>
        </label>
      </div>

      <div class="auth-actions">
        <button type="submit" id="login-btn" class="btn btn-primary">Log in</button>
        <button type="button" id="signup-btn" class="btn btn-secondary">Sign up</button>
      </div>
    </form>

    <p id="status" class="form-status" role="status"></p>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', path='js/login.js') }}"></script>
{% endblock %}
