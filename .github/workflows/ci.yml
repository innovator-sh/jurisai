name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (app/ only — see plan's Verification section)
        run: uv run mypy backend/app

      - name: Pytest (with coverage, >= 70% overall via pyproject)
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Coverage gate -- auth and ownership paths at 100%
        # Every file that decides who a caller is or whose data they may touch.
        # A new branch in any of these without a test fails the build.
        run: >
          uv run coverage report --fail-under=100
          --include="backend/app/api/auth.py,backend/app/api/sessions.py,backend/app/core/security.py,backend/app/core/rate_limit.py,backend/app/repositories/chat_repository.py,backend/app/repositories/user_repository.py,backend/app/repositories/refresh_token_repository.py"

      - name: pip-audit
        run: uv run pip-audit
        continue-on-error: true # tighten to blocking once a baseline is established

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t jurisai:ci .

  eval:
    # Non-blocking retrieval-quality report (plan item Sprint 3.10, extended
    # for BNS in Sprint 3B) — not a merge gate. Self-contained against an
    # in-memory Qdrant per corpus, but needs the real source PDFs (via LFS)
    # and the real embedding model, so it's slow.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        corpus: [ipc, bns]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Retrieval-hit-rate eval
        run: uv run python scripts/eval.py --corpus ${{ matrix.corpus }}
        continue-on-error: true
