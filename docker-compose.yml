services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017/jurisai
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/backend/data:ro
    depends_on:
      - mongo
      - qdrant

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # so `python scripts/ingest.py` can run from the host
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  mongo_data:
  qdrant_storage:
