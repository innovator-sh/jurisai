[project]
name = "jurisai"
version = "0.1.0"
description = "RAG-based legal assistant for Indian criminal law (IPC / BNS)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.10",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "slowapi>=0.1.9",
    "jinja2>=3.1",
    "email-validator>=2.2",
    "tenacity>=9.0",
    "groq>=0.11",
    "mistralai>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mongomock>=4.2",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
# Sprint 6 exit criterion: >= 70% on app/. (The auth/ownership files are held
# to 100% separately -- see the "Coverage gate" step in ci.yml.)
fail_under = 70

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
